spring:
  application:
    name: service-user

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  config:
    import: optional:configserver:http://external-configuration:8888
    fail-fast: true
    retry:
      max-attempts: 10
      initial-interval: 1000

  main:
    allow-bean-definition-overriding: true