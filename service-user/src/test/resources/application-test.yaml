spring:
  datasource:
    url: jdbc:h2:mem:user_service;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration

eureka:
  client:
    enabled: false

kafka:
  topic:
    user-events: users

outbox:
  publish-fixed-delay-ms: 600000
